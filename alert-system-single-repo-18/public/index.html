<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Index Alerts</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header id="top" aria-live="off"></header>
<div id="banner" hidden></div>
<main>
  <section id="view-signal" class="view"></section>
  <section id="view-market" class="view" hidden></section>
  <section id="view-logs" class="view" hidden></section>
  <section id="view-settings" class="view" hidden></section>
</main>
<nav id="nav" aria-label="Sections">
  <button data-tab="signal" class="on">Signal</button>
  <button data-tab="market">Market</button>
  <button data-tab="logs">Logs<i id="logcount"></i></button>
  <button data-tab="settings">Settings</button>
</nav>
<div id="toast" role="status" aria-live="polite"></div>
<noscript>This app needs JavaScript.</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
