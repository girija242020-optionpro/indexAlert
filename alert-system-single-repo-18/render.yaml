services:
  - type: web
    name: dhan-alert-backend
    runtime: node
    plan: starter          # free plans sleep after idle; a market feed must stay awake
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - { key: NODE_VERSION, value: "22" }
      - { key: DHAN_CLIENT_ID, sync: false }
      - { key: DHAN_PIN, sync: false }
      - { key: DHAN_TOTP_SECRET, sync: false }
      - { key: DHAN_ACCESS_TOKEN, sync: false }
      - { key: VAPID_PUBLIC_KEY, sync: false }
      - { key: VAPID_PRIVATE_KEY, sync: false }
      - { key: VAPID_SUBJECT, sync: false }
      - { key: API_KEY, sync: false }
      - { key: ALLOWED_ORIGINS, sync: false }
